# Render blueprint for the Kaned API.
# Create the service from this file: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: kaned-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build --workspace @kaned/shared && npm run build --workspace @kaned/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Render injects PORT itself; the app reads it.
      - key: DATABASE_URL
        fromDatabase:
          name: kaned-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The Vercel origin(s) allowed to call this API, comma separated.
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: kaned-db
    plan: free
    region: singapore
    databaseName: kaned
    user: kaned
