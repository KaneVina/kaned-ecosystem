<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2448D8" />
    <meta
      name="description"
      content="Kaned Ecosystem — kho học liệu, tính GPA và tra cứu môn học cho sinh viên đại học Việt Nam."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232448D8'/%3E%3Ctext x='16' y='22' font-family='Syne,Verdana,sans-serif' font-size='17' font-weight='800' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Syne:wght@700;800&family=Patrick+Hand&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <title>Kaned Ecosystem</title>
    <script>
      // Self-heal: a tab restored from before a deploy can ask for script/style files that no longer exist
      // (the page then shows up as unstyled text). Reload once to fetch the current page.
      (function () {
        function heal() {
          try {
            var last = Number(sessionStorage.getItem('kaned.heal') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('kaned.heal', String(Date.now()));
          } catch (e) {}
          location.reload();
        }
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t !== window && ((t.tagName === 'LINK' && t.rel === 'stylesheet' && /\/assets\//.test(t.href)) || (t.tagName === 'SCRIPT' && /\/assets\//.test(t.src)))) heal();
          },
          true,
        );
        addEventListener('vite:preloadError', heal);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
